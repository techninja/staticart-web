<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="font-family: system-ui, -apple-system, sans-serif; font-size: 14px;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- ==================== -->
  <!-- Left column: DB group -->
  <!-- ==================== -->
  <rect x="20" y="20" width="310" height="120" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <!-- "Database" title: icon+text centered in 310px box starting at x=20, center=175 -->
  <!-- ~92px total width, so start at 175-46=129 -->
  <g transform="translate(129, 33)">
    <g transform="scale(0.65)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>
    </g>
    <text x="22" y="13" font-weight="600" font-size="15" fill="#1e293b">Database</text>
  </g>
  <rect x="50" y="62" width="250" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="175" y="90" text-anchor="middle" fill="#1e293b">DynamoDB</text>

  <!-- ========================= -->
  <!-- Left column: Build Trigger -->
  <!-- ========================= -->
  <rect x="60" y="210" width="230" height="56" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <!-- icon+text centered in 230px box starting at x=60, center=175 -->
  <g transform="translate(95, 218)">
    <g transform="scale(0.75)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/>
    </g>
    <text x="24" y="14" fill="#1e293b">Build Trigger</text>
  </g>
  <text x="175" y="252" text-anchor="middle" font-size="12" fill="#475569">(GitHub Actions)</text>

  <!-- Stock Changed: DB → Build Trigger -->
  <line x1="120" y1="144" x2="120" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="180" text-anchor="start" font-size="13" fill="#475569" stroke="#f8fafc" stroke-width="3" paint-order="stroke">Stock Changed</text>

  <!-- ======================== -->
  <!-- Right column: API group  -->
  <!-- ======================== -->
  <rect x="370" y="20" width="330" height="280" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <!-- "API (Lambda)" title: icon+text centered in 330px box starting at x=370, center=535 -->
  <!-- ~117px total width, so start at 535-58=477 -->
  <g transform="translate(477, 33)">
    <g transform="scale(0.65)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>
    </g>
    <text x="22" y="13" font-weight="600" font-size="15" fill="#1e293b">API (Lambda)</text>
  </g>

  <rect x="400" y="62" width="270" height="36" rx="6" fill="#d97706" stroke="#b45309" opacity="0.15"/>
  <rect x="400" y="62" width="270" height="36" rx="6" fill="none" stroke="#d97706"/>
  <text x="535" y="86" text-anchor="middle" fill="#92400e" font-weight="600">POST /checkout</text>

  <rect x="400" y="108" width="270" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="535" y="132" text-anchor="middle" fill="#1e293b">POST /webhook</text>

  <rect x="400" y="154" width="270" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="535" y="178" text-anchor="middle" fill="#1e293b">GET /stock</text>

  <rect x="400" y="200" width="270" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="535" y="224" text-anchor="middle" fill="#1e293b">GET /orders</text>

  <rect x="400" y="246" width="270" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="535" y="270" text-anchor="middle" fill="#1e293b">GET /session</text>

  <!-- Stock & Orders: API ↔ DB (bidirectional horizontal) -->
  <line x1="334" y1="84" x2="396" y2="84" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="365" y="74" text-anchor="middle" font-size="13" fill="#475569" stroke="#f8fafc" stroke-width="3" paint-order="stroke">Stock &amp; Orders</text>

  <!-- ======================== -->
  <!-- Bottom: CDN group        -->
  <!-- ======================== -->
  <rect x="20" y="330" width="680" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <!-- "Static Site (CDN)" title: icon+text centered in 680px box starting at x=20, center=360 -->
  <!-- ~142px total width, so start at 360-71=289 -->
  <g transform="translate(289, 343)">
    <g transform="scale(0.65)" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>
    </g>
    <text x="22" y="13" font-weight="600" font-size="15" fill="#1e293b">Static Site (CDN)</text>
  </g>

  <rect x="50" y="372" width="180" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="140" y="400" text-anchor="middle" fill="#1e293b">Product pages</text>

  <rect x="270" y="372" width="180" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="360" y="400" text-anchor="middle" fill="#1e293b">Cart (localStorage)</text>

  <rect x="490" y="372" width="180" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="580" y="400" text-anchor="middle" fill="#1e293b">SPA (Hybrids.js)</text>

  <!-- ======================== -->
  <!-- Connecting arrows         -->
  <!-- ======================== -->

  <!-- Deploy: Build Trigger → CDN -->
  <line x1="175" y1="270" x2="175" y2="326" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="187" y="302" text-anchor="start" font-size="13" fill="#475569" stroke="#f8fafc" stroke-width="3" paint-order="stroke">Deploy</text>

  <!-- Checkout: CDN → POST /checkout (golden, from right side) -->
  <path d="M 704 394 L 716 394 L 716 80 L 674 80" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrow-gold)"/>
  <!-- shopping cart icon + label to the right of the line -->
  <g transform="translate(724, 200)">
    <g transform="scale(0.7)" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
    </g>
    <text x="8" y="34" text-anchor="middle" font-size="13" fill="#d97706" stroke="#f8fafc" stroke-width="3" paint-order="stroke">Checkout</text>
  </g>
</svg>
